[package]
name = "amnion"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A calm terminal projection client for governed agent work"
license = "MIT"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

